services:
  mysql:
    image: mysql:8.4
    container_name: neurosphere-mysql
    restart: unless-stopped
    init: true
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in infra/.env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in infra/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in infra/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  platform-api:
    # Linux host networking lets the app use the host's loopback-only AI API and MySQL port.
    image: maven:3.9.9-eclipse-temurin-21
    container_name: neurosphere-platform-api
    restart: unless-stopped
    init: true
    user: "1000:1000"
    network_mode: host
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../platform-api/target/platform-api-0.1.0.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    environment:
      NS_BIND_ADDRESS: 127.0.0.1
      NS_PLATFORM_PORT: "8081"
      NS_DB_URL: "jdbc:mysql://127.0.0.1:3307/${MYSQL_DATABASE:?Set MYSQL_DATABASE in infra/.env}?serverTimezone=UTC"
      NS_DB_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in infra/.env}
      NS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in infra/.env}
      NS_JWT_SECRET_BASE64: ${NS_JWT_SECRET_BASE64:?Set NS_JWT_SECRET_BASE64 in infra/.env}
      NS_BOOTSTRAP_USERNAME: ${NS_BOOTSTRAP_USERNAME-}
      NS_BOOTSTRAP_PASSWORD: ${NS_BOOTSTRAP_PASSWORD-}
      NS_AI_ENGINE_URL: ${NS_AI_ENGINE_URL:-http://127.0.0.1:8000}
      NS_CORS_ALLOWED_ORIGINS: ${NS_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8765}

volumes:
  mysql-data:
    name: neurosphere-mysql-data
