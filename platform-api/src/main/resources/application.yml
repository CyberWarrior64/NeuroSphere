server:
  address: ${NS_BIND_ADDRESS:127.0.0.1}
  port: ${NS_PLATFORM_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: neurosphere-platform-api
  datasource:
    url: ${NS_DB_URL}
    username: ${NS_DB_USERNAME}
    password: ${NS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

neurosphere:
  jwt:
    secret-base64: ${NS_JWT_SECRET_BASE64:}
    issuer: neurosphere-platform
    access-token-minutes: 15
  ai:
    base-url: ${NS_AI_ENGINE_URL:http://127.0.0.1:8000}
  cors:
    allowed-origins: ${NS_CORS_ALLOWED_ORIGINS:http://127.0.0.1:8765,http://localhost:5173}
